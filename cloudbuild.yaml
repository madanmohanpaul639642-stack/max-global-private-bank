# =======================================================
# Google Cloud Build Pipeline for Max Global Private Bank
# Usage: gcloud builds submit --config cloudbuild.yaml
# =======================================================
steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/max-global-bank:$COMMIT_SHA', '.']

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/max-global-bank:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'max-global-bank-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/max-global-bank:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/max-global-bank:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
